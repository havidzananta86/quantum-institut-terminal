<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Quantum Institut</title>
<script src="assets/js/auth.js"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<script src="assets/js/theme-toggle.js"></script>
<link rel="stylesheet" href="assets/css/tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
body { background:#050A1A; color:#e2e8f0; font-family:'Inter',sans-serif; }
.role-badge { display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em; }
.role-admin  { background:#7C4DFF22;color:#A78BFA;border:1px solid #7C4DFF44; }
.role-pro    { background:#F59E0B22;color:#FCD34D;border:1px solid #F59E0B44; }
.role-user   { background:#1E293B;color:#94A3B8;border:1px solid #334155; }
.active-dot  { width:8px;height:8px;border-radius:50%;display:inline-block; }
</style>
</head>
<body class="min-h-screen">

<!-- ADMIN GATE -->
<div id="qiAdminGate" class="fixed inset-0 z-50 bg-qi-bg flex items-center justify-center">
    <div id="adminGateLoading" class="text-center">
        <div class="w-10 h-10 border-2 border-qi-cyan border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <div class="text-slate-500 text-sm">Memverifikasi akses admin…</div>
    </div>
    <div id="adminGateDenied" class="hidden text-center max-w-sm p-8">
        <div class="text-4xl mb-4">🔒</div>
        <h2 class="font-heading font-bold text-white text-xl mb-2">Akses Ditolak</h2>
        <p class="text-slate-400 text-sm mb-6">Halaman ini hanya untuk administrator Quantum Institut.</p>
        <a href="dashboard.html" class="px-6 py-2.5 bg-qi-cyan text-slate-950 font-bold rounded-xl text-sm">Kembali ke Dashboard</a>
    </div>
</div>

<script>
(function() {
    var token = null, userData = null;
    try {
        token = (typeof QuantumAuth !== 'undefined' && QuantumAuth.getToken)
            ? QuantumAuth.getToken()
            : (localStorage.getItem('qi_token') || sessionStorage.getItem('qi_token'));
        var raw = localStorage.getItem('qi_user') || sessionStorage.getItem('qi_user');
        userData = raw ? JSON.parse(raw) : null;
    } catch(e) {}
    if (!token) {
        try { sessionStorage.setItem('qi_redirect_after_login', 'admin.html'); } catch(e) {}
        window.location.replace('login.html'); return;
    }
    if (!userData || userData.role !== 'admin') {
        document.getElementById('adminGateLoading').classList.add('hidden');
        document.getElementById('adminGateDenied').classList.remove('hidden');
        return;
    }
    document.getElementById('qiAdminGate').style.display = 'none';
})();
</script>

<!-- MAIN CONTENT -->
<div class="max-w-6xl mx-auto p-4 sm:p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-slate-500 hover:text-qi-cyan transition-colors text-sm">← Dashboard</a>
            <span class="text-slate-700">|</span>
            <h1 class="font-heading font-bold text-white text-xl">Admin Panel</h1>
        </div>
        <div id="adminBadge" class="role-badge role-admin">ADMIN</div>
    </div>

    <!-- Stats row -->
    <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-qi-card border border-qi-border rounded-xl p-4 text-center">
            <div class="text-2xl font-bold text-white" id="statTotal">—</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider mt-1">Total Users</div>
        </div>
        <div class="bg-qi-card border border-qi-border rounded-xl p-4 text-center">
            <div class="text-2xl font-bold text-qi-gold" id="statPro">—</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider mt-1">PRO Users</div>
        </div>
        <div class="bg-qi-card border border-qi-border rounded-xl p-4 text-center">
            <div class="text-2xl font-bold text-qi-purple" id="statAdmin">—</div>
            <div class="text-[10px] text-slate-500 uppercase tracking-wider mt-1">Admins</div>
        </div>
    </div>

    <!-- Search bar -->
    <div class="bg-qi-card border border-qi-border rounded-xl p-4 mb-4 flex gap-3">
        <input type="search" id="searchInput" placeholder="Cari email pengguna…"
               class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm outline-none focus:border-qi-cyan/50 transition-colors">
        <button onclick="loadUsers()" class="px-4 py-2 bg-qi-cyan text-slate-950 font-bold rounded-lg text-sm hover:bg-qi-cyan/80 transition-colors">Cari</button>
        <button onclick="document.getElementById('searchInput').value=''; loadUsers()" class="px-3 py-2 bg-slate-800 text-slate-400 hover:text-white rounded-lg text-sm transition-colors">Reset</button>
    </div>
    <div id="searchInput-keydown"></div>

    <!-- User table -->
    <div class="bg-qi-card border border-qi-border rounded-xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-qi-border">
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">ID</th>
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">Email</th>
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">Role</th>
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">Status</th>
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">Bergabung</th>
                        <th class="text-left text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-4 py-3">Aksi</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="6" class="text-center text-slate-600 py-8 text-sm">Memuat data pengguna…</td></tr>
                </tbody>
            </table>
        </div>
        <!-- Pagination -->
        <div class="flex items-center justify-between px-4 py-3 border-t border-qi-border">
            <div class="text-[11px] text-slate-500" id="paginationInfo">—</div>
            <div class="flex gap-2">
                <button id="btnPrev" onclick="changePage(-1)" disabled
                        class="px-3 py-1.5 bg-slate-800 text-slate-400 hover:text-white disabled:opacity-40 rounded text-xs transition-colors">← Prev</button>
                <button id="btnNext" onclick="changePage(1)" disabled
                        class="px-3 py-1.5 bg-slate-800 text-slate-400 hover:text-white disabled:opacity-40 rounded text-xs transition-colors">Next →</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="adminToast" class="fixed bottom-6 right-6 hidden z-50">
        <div class="px-4 py-3 bg-slate-800 border border-qi-border rounded-xl text-sm text-white shadow-xl max-w-xs" id="adminToastMsg"></div>
    </div>
</div>

<script>
let currentPage = 0;
const PAGE_SIZE = 25;
let totalUsers  = 0;
let _toastTimer = null;

function showToast(msg, ok = true) {
    const el  = document.getElementById('adminToast');
    const msg_ = document.getElementById('adminToastMsg');
    msg_.textContent = msg;
    msg_.className   = 'px-4 py-3 rounded-xl text-sm text-white shadow-xl max-w-xs border ' +
                       (ok ? 'bg-slate-800 border-qi-green/40' : 'bg-red-950 border-qi-red/40');
    el.classList.remove('hidden');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

async function loadUsers(page = currentPage) {
    const q   = document.getElementById('searchInput').value.trim();
    const url = `api/admin-users.php?limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}` + (q ? `&q=${encodeURIComponent(q)}` : '');
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-slate-600 py-8 text-xs">Memuat…</td></tr>`;
    try {
        const res  = await fetch(url, { headers: authHeaders() });
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.message || 'Error');
        totalUsers   = data.total;
        currentPage  = page;

        // Update stats
        if (data.stats) {
            const s = data.stats;
            document.getElementById('statTotal').textContent  = (s.user||0) + (s.pro||0) + (s.admin||0);
            document.getElementById('statPro').textContent    = s.pro || 0;
            document.getElementById('statAdmin').textContent  = s.admin || 0;
        }

        // Pagination
        document.getElementById('paginationInfo').textContent =
            `Menampilkan ${page * PAGE_SIZE + 1}–${Math.min((page+1)*PAGE_SIZE, totalUsers)} dari ${totalUsers}`;
        document.getElementById('btnPrev').disabled = page === 0;
        document.getElementById('btnNext').disabled = (page + 1) * PAGE_SIZE >= totalUsers;

        if (!data.users.length) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-slate-600 py-8 text-xs">Tidak ada pengguna ditemukan</td></tr>`;
            return;
        }

        tbody.innerHTML = data.users.map(u => {
            const roleClass = u.role === 'admin' ? 'role-admin' : u.role === 'pro' ? 'role-pro' : 'role-user';
            const dotColor  = u.is_active ? '#10B981' : '#4B5563';
            const dot       = `<span class="active-dot" style="background:${dotColor}" title="${u.is_active ? 'Aktif' : 'Nonaktif'}"></span>`;
            const joined    = new Date(u.created_at).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
            return `<tr class="border-b border-qi-border/50 hover:bg-slate-800/30 transition-colors">
                <td class="px-4 py-3 text-slate-500 text-xs font-mono">#${u.id}</td>
                <td class="px-4 py-3 text-white text-xs">${escHtml(u.email)}</td>
                <td class="px-4 py-3">
                    <select onchange="setRole(${u.id}, this.value, this)"
                            class="text-[10px] bg-slate-900 border border-slate-700 text-slate-300 rounded px-2 py-1 outline-none">
                        <option value="user"  ${u.role==='user'  ? 'selected':''}>User</option>
                        <option value="pro"   ${u.role==='pro'   ? 'selected':''}>PRO</option>
                        <option value="admin" ${u.role==='admin' ? 'selected':''}>Admin</option>
                    </select>
                </td>
                <td class="px-4 py-3">${dot} <span class="text-xs text-slate-400">${u.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
                <td class="px-4 py-3 text-slate-500 text-xs">${joined}</td>
                <td class="px-4 py-3">
                    <button onclick="toggleActive(${u.id}, ${u.is_active})"
                            class="text-[10px] px-2.5 py-1 rounded border transition-colors ${u.is_active
                                ? 'border-qi-red/40 text-qi-red hover:bg-qi-red/10'
                                : 'border-qi-green/40 text-qi-green hover:bg-qi-green/10'}">
                        ${u.is_active ? 'Nonaktifkan' : 'Aktifkan'}
                    </button>
                </td>
            </tr>`;
        }).join('');
    } catch(err) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-qi-red py-8 text-xs">${escHtml(err.message)}</td></tr>`;
    }
}

async function setRole(userId, newRole, selectEl) {
    try {
        const res  = await fetch('api/admin-users.php', {
            method: 'POST', headers: { 'Content-Type':'application/json', ...authHeaders() },
            body: JSON.stringify({ type:'set_role', user_id: userId, role: newRole })
        });
        const data = await res.json();
        if (data.status === 'success') { showToast(`Role #${userId} diubah ke ${newRole}`); loadUsers(); }
        else { showToast(data.message || 'Gagal', false); loadUsers(); }
    } catch(e) { showToast('Network error', false); loadUsers(); }
}

async function toggleActive(userId, currentActive) {
    try {
        const res  = await fetch('api/admin-users.php', {
            method: 'POST', headers: { 'Content-Type':'application/json', ...authHeaders() },
            body: JSON.stringify({ type:'toggle_active', user_id: userId })
        });
        const data = await res.json();
        if (data.status === 'success') { showToast(`Status pengguna #${userId} diubah`); loadUsers(); }
        else showToast(data.message || 'Gagal', false);
    } catch(e) { showToast('Network error', false); }
}

function changePage(dir) {
    const newPage = currentPage + dir;
    if (newPage < 0) return;
    if (newPage * PAGE_SIZE >= totalUsers && dir > 0) return;
    loadUsers(newPage);
}

function authHeaders() {
    const token = (typeof QuantumAuth !== 'undefined' && QuantumAuth.getToken)
        ? QuantumAuth.getToken()
        : (localStorage.getItem('qi_token') || sessionStorage.getItem('qi_token') || '');
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(0); });

document.addEventListener('DOMContentLoaded', () => {
    const gate = document.getElementById('qiAdminGate');
    if (gate && gate.style.display === 'none') loadUsers(0);
    // Wait up to 1s for gate to clear (async verify)
    const interval = setInterval(() => {
        if (gate && gate.style.display === 'none') { clearInterval(interval); loadUsers(0); }
    }, 100);
    setTimeout(() => clearInterval(interval), 1500);
});
</script>
</body>
</html>
