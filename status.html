    <link rel="stylesheet" href="assets/css/tokens.css?v=1.4.5">

    <script src="assets/js/a11y.js?v=1.0.4" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: var(--qi-bg, #0B1220); color: var(--qi-text, #CBD5E1); }
        .font-heading { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-dot.ok      { background: #00FFA3; box-shadow: 0 0 8px #00FFA360; }
        .status-dot.warn    { background: #FBBF24; box-shadow: 0 0 8px #FBBF2460; }
        .status-dot.error   { background: #FF4D6D; box-shadow: 0 0 8px #FF4D6D60; }
        .status-dot.pending { background: #64748B; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
    <link rel="stylesheet" href="assets/css/qim-sentuh.css?v=1.0.0">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
    <meta property="og:site_name" content="Quantum Institut Market Terminal">
    <meta property="og:locale" content="id_ID">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Status — Quantum Institut">
    <meta name="twitter:description" content="Status server dan layanan Quantum Institut Market Terminal secara real-time.">
    <meta name="twitter:image" content="https://quantum-institut.com/og-image.png">
</head>
<body class="min-h-screen">

    <!-- Header -->
    <header class="border-b border-slate-800 px-4 sm:px-8 py-6">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2.5">
                    <img src="assets/img/logo-mark.svg" alt="Quantum Institut" width="32" height="32" class="w-8 h-8">
                    <div>
                        <div class="font-heading font-bold text-white text-sm">QUANTUM INSTITUT</div>
                        <div class="text-[10px] text-slate-500">System Status</div>
                    </div>
                </a>
            </div>
            <div id="globalBadge" class="font-mono text-xs px-3 py-1.5 rounded-full border border-slate-700 text-slate-400">
                Memeriksa...
            </div>
        </div>
    </header>

    <!-- Status Grid -->
    <main class="max-w-3xl mx-auto px-4 sm:px-8 py-8 space-y-4">
        <h1 class="font-heading font-bold text-white text-xl mb-6">API Endpoints</h1>

        <div id="statusList" class="space-y-2"></div>

        <div class="flex items-center justify-between mt-8">
            <p class="text-[11px] text-slate-600 font-mono">Terakhir dicek: <span id="lastCheck">—</span></p>
            <div class="flex items-center gap-2">
                <span id="nextCheckCountdown" class="text-[10px] text-slate-600 font-mono"></span>
                <button type="button" id="btnCekSekarang" class="text-[10px] font-mono text-cyan-500 hover:text-cyan-400 transition-colors">↻ Cek Sekarang</button>
            </div>
        </div>
    </main>

    <script src="assets/js/halaman-status.js?v=1.0.0"></script>
</body>
</html>
