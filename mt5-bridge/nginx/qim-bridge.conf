# Production reverse proxy: wss://bridge.quantum-institut.com → bridge on 127.0.0.1:8000
# Works with nginx for Windows on the MT5 VPS, or a Linux proxy in front of it
# (then replace 127.0.0.1 with the VPS address and firewall port 8000 to that proxy only).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Tokens travel in the first WebSocket message / Authorization header, never in URLs,
# but keep query strings out of the log anyway.
log_format bridge '$remote_addr [$time_local] "$request_method $uri" $status $request_time';

limit_req_zone  $binary_remote_addr zone=bridge_rest:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=bridge_conn:10m;

upstream qim_bridge {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name bridge.quantum-institut.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bridge.quantum-institut.com;

    ssl_certificate     /etc/letsencrypt/live/bridge.quantum-institut.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.quantum-institut.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log logs/bridge_access.log bridge;

    location /ws/ {
        proxy_pass http://qim_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;          # > uvicorn ping interval (20s)
        proxy_send_timeout 75s;
        proxy_buffering off;             # ticks must not wait in a proxy buffer
        tcp_nodelay on;
        limit_conn bridge_conn 5;        # sockets per IP
    }

    location /api/ {
        proxy_pass http://qim_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=bridge_rest burst=20 nodelay;
    }

    location = /health {
        proxy_pass http://qim_bridge;
        allow 127.0.0.1;                 # add your monitoring IP here
        deny all;
    }

    location / {
        return 404;
    }
}
